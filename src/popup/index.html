<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Twitchy settings</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <h1>Twitchy</h1>
    <form id="settings">
      <label class="row">
        <input type="checkbox" name="pickerEmotes" />
        <span>
          Show 7TV, BetterTTV and FrankerFaceZ emotes in the emote picker
        </span>
      </label>
      <label class="row row--sub">
        <span>Show only the most used when a provider has more than</span>
        <input type="number" name="pickerLimit" inputmode="numeric" />
      </label>
      <label class="row">
        <input type="checkbox" name="colonAutocomplete" />
        <span>Suggest emotes when I type : and two letters</span>
      </label>
      <label class="row">
        <input type="checkbox" name="messageHistory" />
        <span>Bring back my sent messages with the Up and Down arrows</span>
      </label>
      <label class="row row--select">
        <span>Deleted messages</span>
        <select name="deletedMessages">
          <option value="strike">Show them struck through</option>
          <option value="faded">Show them faded</option>
          <option value="twitch">Hide them, like Twitch</option>
        </select>
      </label>
      <label class="row">
        <input type="checkbox" name="autoClaimPoints" />
        <span>Claim the channel points bonus automatically</span>
      </label>
      <label class="row">
        <input type="checkbox" name="skipContentWarning" />
        <span>Skip the content warning before mature streams</span>
      </label>
      <label class="row">
        <input type="checkbox" name="videoStats" />
        <span>Show latency, quality and bitrate under the player</span>
      </label>
      <label class="row">
        <input type="checkbox" name="sidebarPreviews" />
        <span>Show a stream preview when I hover a channel in the sidebar</span>
      </label>
      <label class="row row--sub">
        <input type="checkbox" name="sidebarPreviewVideo" />
        <span>Play the stream with its sound, muting the one I'm watching</span>
      </label>
      <label class="row">
        <input type="checkbox" name="sidebarExpandOnHover" />
        <span>Expand the collapsed sidebar when I hover it</span>
      </label>
      <label class="row">
        <input type="checkbox" name="volumeWheel" />
        <span>Turn the volume with the mouse wheel over the player, past 100% for quiet channels</span>
      </label>
      <label class="row">
        <input type="checkbox" name="hideLockedEmotes" />
        <span>Hide emotes I haven't unlocked</span>
      </label>
      <label class="row">
        <input type="checkbox" name="hideSendButton" />
        <span>Hide the Chat button (I send with Enter)</span>
      </label>
      <fieldset>
        <legend>Red count bubbles in the top bar for</legend>
        <label class="row"><input type="checkbox" name="badge-giftSubs" /><span>Gift subs</span></label>
        <label class="row"><input type="checkbox" name="badge-drops" /><span>Drops and rewards</span></label>
        <label class="row"><input type="checkbox" name="badge-streaks" /><span>Watch streaks</span></label>
        <label class="row"><input type="checkbox" name="badge-promotions" /><span>Promotions and recommendations</span></label>
        <label class="row"><input type="checkbox" name="badge-other" /><span>Other notifications</span></label>
        <label class="row"><input type="checkbox" name="badge-whispers" /><span>Whispers</span></label>
      </fieldset>
    </form>
    <p class="note">Changes apply right away on open Twitch tabs.</p>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
